<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sala de teste — Nellio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="room.js"></script>
  <style>
    :root { --bg:#f6f7f5; --surface:#fff; --line:#dfe5e0; --text:#17251e; --muted:#5f6f65; --green:#2d5e48; --red:#b94841; --amber:#8a5a12; }
    @media (prefers-color-scheme: dark) { :root { --bg:#151716; --surface:#1e2120; --line:#2f3431; --text:#e9eeeb; --muted:#9aa69f; --green:#5fae86; --red:#e07a73; --amber:#e0b45f; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:20px 16px 40px; }
    h1 { font-size:22px; margin:0 0 4px; }
    p.note { color:var(--muted); margin:0 0 16px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input { font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); min-width:0; }
    button { font:inherit; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; }
    button.primary { background:var(--green); border-color:var(--green); color:#fff; }
    button.danger { color:var(--red); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
    .tile { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/10; }
    .tile video { width:100%; height:100%; object-fit:cover; display:block; }
    .tile .label { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.6); color:#fff; padding:3px 8px; border-radius:6px; font-size:12px; }
    .tile.me video { transform:scaleX(-1); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
    .ok { color:var(--green); font-weight:600; } .bad { color:var(--red); font-weight:600; } .wait { color:var(--amber); font-weight:600; }
    #log { max-height:180px; overflow:auto; font:12px/1.5 ui-monospace, Consolas, monospace; color:var(--muted); white-space:pre-wrap; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<main>
  <h1>Sala de teste (Fase 0)</h1>
  <p class="note">Página de laboratório, fora do produto. Usa o staging. Abra o mesmo link em outro aparelho ou aba para entrar na mesma sala (até 4 pessoas).</p>

  <section class="card" id="lobby">
    <div class="row">
      <input id="name" placeholder="Seu nome" maxlength="40">
      <input id="room" placeholder="Código da sala" maxlength="40">
      <label class="row" style="gap:6px"><input type="checkbox" id="media" checked style="min-width:auto"> câmera e microfone</label>
      <label class="row" style="gap:6px"><input type="checkbox" id="fake" style="min-width:auto"> vídeo de teste (sem câmera)</label>
      <label class="row" style="gap:6px"><input type="checkbox" id="relay" style="min-width:auto"> forçar TURN</label>
      <button class="primary" id="join">Entrar na sala</button>
    </div>
    <p class="note" id="lobby-msg" style="margin:10px 0 0"></p>
  </section>

  <section id="stage" class="hidden">
    <div class="card row">
      <strong id="room-label"></strong>
      <button id="mic">Desligar microfone</button>
      <button id="cam">Desligar câmera</button>
      <button id="copy">Copiar relatório</button>
      <button class="danger" id="leave">Sair</button>
    </div>
    <div class="grid" id="videos"></div>
    <div class="card" style="margin-top:14px">
      <table><thead><tr><th>Pessoa</th><th>Conexão</th><th>Caminho</th><th>Tempo até conectar</th><th>Atraso (RTT)</th></tr></thead><tbody id="peers"></tbody></table>
    </div>
    <div class="card"><div id="log"></div></div>
  </section>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const cfg = window.PATHWAY_SUPABASE_CONFIG || {};
  const supabase = window.supabase.createClient(cfg.url, cfg.anonKey || cfg.publishableKey || cfg.key, { auth: { persistSession: false }, realtime: { params: { eventsPerSecond: 20 } } });
  const ICE = [{ urls: 'stun:stun.cloudflare.com:3478' }, { urls: 'stun:stun.l.google.com:19302' }];
  const PATH = { host: 'mesma rede', srflx: 'direto pela internet', prflx: 'direto pela internet', relay: 'retransmitido (TURN)' };
  let room = null, stream = null, micOn = true, camOn = true, wakeLock = null;
  const logLines = [];

  const params = new URLSearchParams(location.hash.slice(1));
  $('room').value = params.get('room') || Math.random().toString(36).slice(2, 8);
  try { $('name').value = localStorage.getItem('lab-name') || ''; } catch {}

  // A moving test picture and a soft tone: lets a second tab (or a computer with one camera) join "with video".
  function fakeStream(label) {
    const canvas = Object.assign(document.createElement('canvas'), { width: 640, height: 400 });
    const g = canvas.getContext('2d');
    let n = 0;
    setInterval(() => { n++; g.fillStyle = 'hsl(' + (n % 360) + ',45%,35%)'; g.fillRect(0, 0, 640, 400); g.fillStyle = '#fff'; g.font = 'bold 42px sans-serif'; g.fillText(label, 40, 200); g.font = '24px sans-serif'; g.fillText(new Date().toLocaleTimeString(), 40, 250); }, 100);
    const video = canvas.captureStream(10);
    try { const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); gain.gain.value = 0.02; osc.frequency.value = 330; const dest = ctx.createMediaStreamDestination(); osc.connect(gain).connect(dest); osc.start(); video.addTrack(dest.stream.getAudioTracks()[0]); } catch {}
    return video;
  }

  function log(text) { const line = new Date().toLocaleTimeString() + '  ' + text; logLines.push(line); $('log').textContent = logLines.slice(-200).join('\n'); $('log').scrollTop = 1e9; }

  function tile(id, label, mediaStream, me) {
    let el = document.querySelector('[data-tile="' + id + '"]');
    if (!el) {
      el = document.createElement('div'); el.className = 'tile' + (me ? ' me' : ''); el.dataset.tile = id;
      el.innerHTML = '<video autoplay playsinline' + (me ? ' muted' : '') + '></video><span class="label"></span>';
      $('videos').appendChild(el);
    }
    const video = el.querySelector('video');
    if (video.srcObject !== mediaStream) { video.srcObject = mediaStream; video.play().catch(() => {}); }
    el.querySelector('.label').textContent = label;
  }

  function paint(list) {
    const ids = new Set(list.map(p => p.id));
    document.querySelectorAll('[data-tile]').forEach(el => { if (el.dataset.tile !== 'me' && !ids.has(el.dataset.tile)) el.remove(); });
    for (const p of list) tile(p.id, p.name, p.stream, false);
    $('peers').innerHTML = list.length ? list.map(p => {
      const cls = p.state === 'connected' ? 'ok' : (p.state === 'failed' || p.state === 'disconnected') ? 'bad' : 'wait';
      return '<tr><td>' + p.name.replace(/</g, '&lt;') + '</td><td class="' + cls + '">' + p.state + '</td><td>' + (p.candidateType ? (PATH[p.candidateType] || p.candidateType) : '—') + '</td><td>' + (p.connectMs != null ? (p.connectMs / 1000).toFixed(1) + ' s' : '—') + '</td><td data-rtt="' + p.id + '">—</td></tr>';
    }).join('') : '<tr><td colspan="5">Ninguém mais na sala ainda. Abra o link em outro aparelho.</td></tr>';
  }

  async function refreshRtt() {
    if (!room) return;
    const stats = await room.stats();
    const list = room.peers();
    stats.forEach((s, i) => { const cell = document.querySelector('[data-rtt="' + (list[i] && list[i].id) + '"]'); if (cell) cell.textContent = s.rttMs != null ? s.rttMs + ' ms' : '—'; });
  }

  $('join').addEventListener('click', async () => {
    const name = $('name').value.trim() || 'Convidado';
    const code = $('room').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '') || 'teste';
    try { localStorage.setItem('lab-name', name); } catch {}
    $('join').disabled = true; $('lobby-msg').textContent = 'Entrando…';
    stream = null;
    if ($('fake').checked) stream = fakeStream(name);
    else if ($('media').checked) {
      try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (error) { log('câmera/microfone: ' + error.name + ' ' + error.message); $('lobby-msg').textContent = 'Não foi possível usar câmera/microfone (' + error.name + '). Entrando só para ver e ouvir.'; }
    }
    // TURN credentials from our own function (the Cloudflare key stays on the server); without them, STUN only.
    let iceServers = ICE;
    try {
      const answer = await fetch(cfg.url + '/functions/v1/meeting-turn', { method: 'POST', headers: { apikey: cfg.publishableKey || cfg.anonKey || '' } });
      const data = await answer.json().catch(() => ({}));
      if (answer.ok && data.iceServers) { iceServers = ICE.concat(data.iceServers); log('TURN: ativo (credenciais por ' + Math.round(data.ttlSeconds / 60) + ' min)'); }
      else log('TURN: indisponível (' + answer.status + ' ' + (data.error || '') + ')');
    } catch (error) { log('TURN: erro ' + error.message); }
    if ($('relay').checked && iceServers === ICE) log('forçar TURN sem TURN configurado: a conexão vai falhar (isso é esperado)');
    room = window.NellioRoom.createRoom({ supabase, roomId: code, name, iceServers, relayOnly: $('relay').checked, on: (event, detail) => {
      if (event === 'log') log(detail.text);
      if (event === 'peers') paint(detail);
      if (event === 'full') alert('A sala já tem 4 pessoas.');
      if (event === 'left') { $('stage').classList.add('hidden'); $('lobby').classList.remove('hidden'); $('join').disabled = false; $('videos').innerHTML = ''; room = null; if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
    } });
    try {
      await room.join(stream);
      location.hash = 'room=' + code;
      $('room-label').textContent = 'Sala ' + code + ' · você: ' + name;
      $('lobby').classList.add('hidden'); $('stage').classList.remove('hidden'); $('lobby-msg').textContent = '';
      tile('me', name + ' (você)', stream || new MediaStream(), true);
      $('mic').disabled = $('cam').disabled = !stream;
      paint(room.peers());
      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }).catch(() => {});
    } catch (error) { $('lobby-msg').textContent = error.message; $('join').disabled = false; room = null; }
  });

  $('mic').addEventListener('click', () => { micOn = !micOn; room && room.setMic(micOn); $('mic').textContent = micOn ? 'Desligar microfone' : 'Ligar microfone'; });
  $('cam').addEventListener('click', () => { camOn = !camOn; room && room.setCam(camOn); $('cam').textContent = camOn ? 'Desligar câmera' : 'Ligar câmera'; });
  $('leave').addEventListener('click', () => room && room.leave());
  $('copy').addEventListener('click', async () => {
    const stats = room ? await room.stats() : [];
    const report = { when: new Date().toISOString(), userAgent: navigator.userAgent, room: $('room-label').textContent, peers: room ? room.peers().map(({ stream, ...p }) => p) : [], stats, log: logLines.slice(-60) };
    try { await navigator.clipboard.writeText(JSON.stringify(report, null, 2)); log('relatório copiado'); } catch { log(JSON.stringify(report)); }
  });
  window.addEventListener('pagehide', () => room && room.leave());
  setInterval(refreshRtt, 3000);
})();
</script>
</body>
</html>
