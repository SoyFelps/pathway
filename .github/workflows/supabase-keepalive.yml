# Keeps the PRODUCTION Supabase project (PathwayAPP, gftnghlkuiuhuwyaajdn) from being
# auto-paused on the free plan. Once a day it calls a public, read-only database function
# with an all-zero token, which only returns null. Uses only the public (publishable) key.
# If the project is paused or unreachable, this job fails and GitHub emails the repo owner.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call get_published_flow on production
        env:
          SUPABASE_URL: https://gftnghlkuiuhuwyaajdn.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_YReNH0qn4Y68VHnCjpqg7g_x9lsdu_I
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 --output /tmp/response.json --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/rest/v1/rpc/get_published_flow" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"p_token":"00000000-0000-0000-0000-000000000000"}')
          echo "HTTP $status"
          cat /tmp/response.json; echo
          test "$status" = "200"
