<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8faf8">
  <meta name="description" content="Apply for a role with Pathway.">
  <title>Apply · Pathway</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23315f4a'/%3E%3Ctext x='15' y='46' font-size='44' fill='%23d2f37a'%3E%E2%86%97%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=my-companies-20261005">
</head>
<body>
  <div id="candidate-app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="pathway.js?v=my-companies-20261005"></script>
  <script src="candidate.js?v=my-companies-20261005"></script>
  <script src="backend.js?v=my-companies-20261005"></script>
  <script>
    (async function () {
      const root = document.getElementById('candidate-app');
      const match = window.location.hash.match(/(?:^|[&#])id=([^&]+)/);
      if (!match) {
        PathwayCandidate.renderInvalid(root, 'This link is missing its published application ID. Ask the hiring team for a new link.');
        return;
      }
      try {
        const publishedFlowId = decodeURIComponent(match[1]);
        const flow = await PathwayBackend.getPublishedFlow(publishedFlowId);
        document.title = `${flow.jobTitle || 'Apply'} · ${flow.companyName || 'Pathway'}`;
        PathwayCandidate.mountCandidate(root, flow, { publishedFlowId });
      } catch (error) {
        PathwayCandidate.renderInvalid(root, error.message || 'The application could not be loaded.');
      }
    })();
  </script>
</body>
</html>
