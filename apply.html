<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f8">
  <meta name="description" content="Apply for a role with Nellio.">
  <title>Apply · Nellio</title>
  <link rel="icon" type="image/svg+xml" href="brand/nellio-icon.svg">
  <link rel="stylesheet" href="styles.css?v=mw3-20261117f">
</head>
<body>
  <div id="candidate-app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>window.PATHWAY_SUPABASE_CONFIG||document.write('<script src="supabase-config.js?retry=1"><\/script>');</script>
  <script>window.PATHWAY_SUPABASE_CONFIG||document.write('<script src="supabase-config.js?retry=2"><\/script>');</script>
  <script src="turnstile-config.js?v=mw3-20261117f"></script>
  <script src="locales/pt-BR.js?v=mw3-20261117f"></script>
  <script src="locales/es.js?v=mw3-20261117f"></script>
  <script src="i18n.js?v=mw3-20261117f"></script>
  <script src="pathway.js?v=mw3-20261117f"></script>
  <script src="geo.js?v=mw3-20261117f"></script>
  <script src="candidate.js?v=mw3-20261117f"></script>
  <script src="backend.js?v=mw3-20261117f"></script>
  <script>
    (async function () {
      const root = document.getElementById('candidate-app');
      const match = window.location.hash.match(/(?:^|[&#])id=([^&]+)/);
      if (!match) {
        PathwayCandidate.renderInvalid(root, 'This link is missing its published application ID. Ask the hiring team for a new link.');
        return;
      }
      if (!window.PathwayBackend) {
        PathwayCandidate.renderInvalid(root, 'A momentary instability occurred. Please try again in a few seconds.');
        return;
      }
      try {
        const publishedFlowId = decodeURIComponent(match[1]);
        const flow = await PathwayBackend.getPublishedFlow(publishedFlowId);
        // The page speaks the job's language (renderInvalid above uses the browser language: the job is not known yet).
        document.title = `${flow.jobTitle || PathwayI18n.forLanguage(flow.jobLanguage).t('Apply')} · ${flow.companyName || 'Nellio'}`;
        PathwayCandidate.mountCandidate(root, flow, { publishedFlowId });
      } catch (error) {
        PathwayCandidate.renderInvalid(root, error.message || 'The application could not be loaded.');
      }
    })();
  </script>
</body>
</html>
